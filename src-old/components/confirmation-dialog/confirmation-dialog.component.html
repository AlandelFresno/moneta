<p-dialog
  [(visible)]="visible"
  [modal]="true"
  [closable]="true"
  styleClass="macos-dialog"
  [style]="{ width: '450px' }"
  (onHide)="onHide()">

  <ng-template pTemplate="header">
    <h3>{{ header }}</h3>
  </ng-template>

  <div class="flex items-start gap-4 py-4">
    <i [class]="icon" class="text-4xl text-amber-500 flex-shrink-0"></i>
    <p class="text-gray-800 dark:text-gray-200 text-[0.95rem] leading-relaxed m-0">{{ message }}</p>
  </div>

  <ng-template pTemplate="footer">
    <button pButton [label]="rejectLabel" class="btn-secondary" (click)="reject()"></button>
    <button pButton [label]="acceptLabel" class="btn-primary" (click)="accept()"></button>
  </ng-template>
</p-dialog>
