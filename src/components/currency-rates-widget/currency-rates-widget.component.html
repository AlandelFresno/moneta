<div class="currency-rates-widget bg-white dark:bg-gray-800 rounded-xl shadow-md overflow-hidden h-full flex flex-col">
  <div class="widget-header flex justify-between items-center p-6 border-b border-gray-200 dark:border-gray-700 text-white"
       style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%)">
    <div class="header-left flex items-center gap-4">
      <div class="w-10 h-10 rounded-[10px] bg-white/20 flex items-center justify-center">
        <i class="pi pi-dollar text-xl"></i>
      </div>
      <div>
        <h3 class="m-0 text-[1.1rem] font-semibold">Tasas de Cambio</h3>
        <span class="cache-status flex items-center gap-1.5 text-xs opacity-90 mt-1" [ngClass]="getCacheStatusClass()">
          <i class="pi pi-circle-fill text-[0.5rem]"></i>
          {{ getCacheStatusText() }}
        </span>
      </div>
    </div>
    <div class="header-actions flex gap-2">
      <button
        pButton
        icon="pi pi-refresh"
        class="p-button-text p-button-rounded p-button-sm"
        [loading]="isLoading"
        (click)="refreshRates()"
        pTooltip="Actualizar tasas"
        tooltipPosition="left"
      ></button>
      <button
        pButton
        icon="pi pi-cog"
        class="p-button-text p-button-rounded p-button-sm"
        (click)="navigateToSettings()"
        pTooltip="Ver todas las tasas"
        tooltipPosition="left"
      ></button>
    </div>
  </div>

  <div class="widget-body flex-1 overflow-y-auto p-4">
    <div class="rates-list flex flex-col gap-3">
      <div class="rate-item p-4 bg-gray-50 dark:bg-gray-700 rounded-lg border-l-[3px] border-l-indigo-500
                  transition-all duration-200 flex justify-between items-center gap-2
                  hover:bg-gray-100 dark:hover:bg-gray-600 hover:translate-x-0.5"
           *ngFor="let rate of topRates">
        <div class="rate-content flex-1 min-w-0">
          <div class="rate-header flex items-baseline gap-2 mb-2">
            <span class="text-base font-semibold text-gray-600 dark:text-gray-200">{{ rate.symbol }} {{ rate.code }}</span>
            <span class="text-[0.85rem] text-gray-500 dark:text-gray-400">{{ rate.name }}</span>
          </div>
          <div class="rate-value">
            <span *ngIf="!rate.isEditing"
                  class="text-[0.95rem] text-indigo-500 dark:text-indigo-400 font-medium font-mono">
              1 {{ rate.code }} = {{ formatRate(rate.rate) }} {{ preferredCurrency }}
            </span>
            <div class="rate-edit-group flex items-center gap-2" *ngIf="rate.isEditing">
              <span class="text-[0.85rem] text-gray-600 dark:text-gray-300 font-medium">1 {{ rate.code }} =</span>
              <input
                type="number"
                [(ngModel)]="rate.editValue"
                class="rate-input w-[120px] py-1.5 px-2.5 border-2 border-indigo-500 rounded-md text-[0.9rem] font-mono
                       outline-none transition-all duration-200 bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-100
                       focus:border-purple-600 focus:shadow-[0_0_0_3px_rgba(118,75,162,0.1)]"
                step="0.0001"
                (keyup.enter)="saveEditRate(rate)"
                (keyup.escape)="cancelEditRate(rate)"
              />
              <span class="text-[0.85rem] text-gray-600 dark:text-gray-300 font-medium">{{ preferredCurrency }}</span>
            </div>
          </div>
        </div>
        <div class="rate-actions flex gap-1 flex-shrink-0">
          <button
            *ngIf="!rate.isEditing"
            pButton
            icon="pi pi-pencil"
            class="p-button-text p-button-rounded p-button-sm edit-btn"
            (click)="startEditRate(rate)"
            pTooltip="Editar tasa"
            tooltipPosition="left"
          ></button>
          <button
            *ngIf="rate.isEditing"
            pButton
            icon="pi pi-check"
            class="p-button-text p-button-rounded p-button-sm p-button-success"
            (click)="saveEditRate(rate)"
            pTooltip="Guardar"
            tooltipPosition="left"
          ></button>
          <button
            *ngIf="rate.isEditing"
            pButton
            icon="pi pi-times"
            class="p-button-text p-button-rounded p-button-sm p-button-danger"
            (click)="cancelEditRate(rate)"
            pTooltip="Cancelar"
            tooltipPosition="left"
          ></button>
        </div>
      </div>
    </div>

    <div class="widget-footer mt-4">
      <div class="flex items-center gap-3 py-3 px-3 bg-sky-50 dark:bg-sky-900/30 border border-sky-400 dark:border-sky-600 rounded-md text-sky-800 dark:text-sky-300 text-[0.85rem]"
           *ngIf="!cacheInfo?.needsUpdate">
        <i class="pi pi-info-circle text-sky-500 dark:text-sky-400"></i>
        <span>Las tasas se guardan con cada transacción</span>
      </div>
      <div class="flex items-center gap-3 py-3 px-3 bg-amber-50 dark:bg-amber-900/30 border border-amber-400 dark:border-amber-600 rounded-md text-amber-800 dark:text-amber-300 text-[0.85rem]"
           *ngIf="cacheInfo?.needsUpdate">
        <i class="pi pi-exclamation-triangle text-amber-500 dark:text-amber-400"></i>
        <span>Las tasas requieren actualización</span>
      </div>
    </div>
  </div>
</div>
