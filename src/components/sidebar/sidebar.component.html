<div class="sidebar" [class.collapsed]="isCollapsed()" [class.mobile-open]="isMobileMenuOpen()">
  <!-- Header -->
  <div class="sidebar-header">
    <button
      class="collapse-btn desktop-only"
      (click)="toggleSidebar()"
      pButton
      icon="pi pi-bars"
      [text]="true">
    </button>
    <button
      class="collapse-btn mobile-only"
      (click)="closeMobileMenu()"
      pButton
      icon="pi pi-times"
      [text]="true">
    </button>
  </div>

  <!-- Navigation Menu -->
  <nav class="sidebar-nav">
    <!-- Sincronizar Drive (arriba) -->
    <button
      class="nav-item export-button sync-drive"
      [class.collapsed]="isCollapsed()"
      (click)="syncWithDrive()"
      pButton
      [text]="true">
      <i class="pi pi-sync"></i>
      <span class="nav-text" *ngIf="!isCollapsed() || isMobileMenuOpen()">Sincronizar Drive</span>
    </button>

    <div class="nav-divider"></div>

    <a
      *ngFor="let item of menuItems"
      [routerLink]="item.route"
      routerLinkActive="active"
      class="nav-item"
      [class.collapsed]="isCollapsed()"
      (click)="closeMobileMenu()">
      <i [class]="'pi pi-' + item.icon"></i>
      <span class="nav-text" *ngIf="!isCollapsed() || isMobileMenuOpen()">{{ item.label }}</span>
      <span class="badge" *ngIf="item.badge && (!isCollapsed() || isMobileMenuOpen())">{{ item.badge }}</span>
    </a>

    <!-- Theme Toggle -->
    <button
      class="nav-item theme-toggle"
      [class.collapsed]="isCollapsed()"
      (click)="toggleTheme()"
      pButton
      [text]="true"
      [pTooltip]="currentTheme === 'light' ? 'Cambiar a tema oscuro' : 'Cambiar a tema claro'"
      tooltipPosition="right">
      <i [class]="currentTheme === 'light' ? 'pi pi-moon' : 'pi pi-sun'"></i>
      <span class="nav-text" *ngIf="!isCollapsed() || isMobileMenuOpen()">
        {{ currentTheme === 'light' ? 'Tema Oscuro' : 'Tema Claro' }}
      </span>
    </button>

    <div class="nav-divider"></div>

    <!-- Currency Selectors -->
    <div class="currency-section" *ngIf="!isCollapsed() || isMobileMenuOpen()">
      <div class="currency-selector-container">
        <label class="currency-label">
          <i class="pi pi-money-bill"></i>
          <span>Moneda Principal</span>
        </label>
        <select
          [(ngModel)]="primaryCurrency"
          (change)="onPrimaryCurrencyChange()"
          class="currency-select">
          <option *ngFor="let currency of currencies" [value]="currency.code">
            {{ currency.code }} - {{ currency.name }}
          </option>
        </select>
      </div>

      <div class="currency-selector-container">
        <label class="currency-label">
          <i class="pi pi-info-circle"></i>
          <span>Detalle en</span>
        </label>
        <select
          [(ngModel)]="secondaryCurrency"
          (change)="onSecondaryCurrencyChange()"
          class="currency-select">
          <option *ngFor="let currency of currencies" [value]="currency.code">
            {{ currency.code }} - {{ currency.name }}
          </option>
        </select>
      </div>
    </div>
  </nav>
</div>

<!-- Mobile Overlay -->
<div
  class="sidebar-overlay"
  *ngIf="isMobileMenuOpen()"
  (click)="closeMobileMenu()">
</div>

<!-- Sync Confirmation Dialog -->
<p-dialog
  [(visible)]="showSyncDialog"
  [modal]="true"
  [closable]="true"
  styleClass="macos-dialog"
  [style]="{ width: '500px' }"
  (onHide)="closeSyncDialog()">
  <ng-template pTemplate="header">
    <h3>Confirmar sincronización</h3>
  </ng-template>

  <div class="dialog-content">
    <p>La sincronización combinará los datos locales con los de Drive. El más reciente prevalecerá. ¿Continuar?</p>
  </div>

  <ng-template pTemplate="footer">
    <button
      pButton
      label="Cancelar"
      class="p-button-text"
      (click)="closeSyncDialog()">
    </button>
    <button
      pButton
      label="Sí, sincronizar"
      (click)="confirmSync()">
    </button>
  </ng-template>
</p-dialog>

<!-- Import Confirmation Dialog -->
<p-dialog
  [(visible)]="showImportDialog"
  [modal]="true"
  [closable]="true"
  styleClass="macos-dialog"
  [style]="{ width: '500px' }"
  (onHide)="closeImportDialog()">
  <ng-template pTemplate="header">
    <h3>Confirmar importación</h3>
  </ng-template>

  <div class="dialog-content">
    <p>¿Deseas importar datos desde este archivo Excel? Esto agregará los datos al sistema actual.</p>
  </div>

  <ng-template pTemplate="footer">
    <button
      pButton
      label="Cancelar"
      class="p-button-text"
      (click)="closeImportDialog()">
    </button>
    <button
      pButton
      label="Sí, importar"
      (click)="confirmImport()">
    </button>
  </ng-template>
</p-dialog>
