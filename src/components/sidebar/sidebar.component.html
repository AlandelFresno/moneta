<div class="sidebar" [class.collapsed]="isCollapsed()" [class.mobile-open]="isMobileMenuOpen()">
  <!-- Header -->
  <div class="sidebar-header">
    <button
      class="collapse-btn desktop-only"
      (click)="toggleSidebar()"
      pButton
      icon="pi pi-bars"
      [text]="true"
      [rounded]="true">
    </button>
    <button
      class="collapse-btn mobile-only"
      (click)="closeMobileMenu()"
      pButton
      icon="pi pi-times"
      [text]="true"
      [rounded]="true">
    </button>
  </div>

  <!-- Navigation Menu -->
  <nav class="sidebar-nav">
    <a
      *ngFor="let item of menuItems"
      [routerLink]="item.route"
      routerLinkActive="active"
      class="nav-item"
      [class.collapsed]="isCollapsed()"
      (click)="closeMobileMenu()">
      <i [class]="'pi pi-' + item.icon"></i>
      <span class="nav-text" *ngIf="!isCollapsed() || isMobileMenuOpen()">{{ item.label }}</span>
      <span class="badge" *ngIf="item.badge && (!isCollapsed() || isMobileMenuOpen())">{{ item.badge }}</span>
    </a>

    <!-- Export Button -->
    <button
      class="nav-item export-button"
      [class.collapsed]="isCollapsed()"
      (click)="exportAllData()"
      pButton
      [text]="true">
      <i class="pi pi-download"></i>
      <span class="nav-text" *ngIf="!isCollapsed() || isMobileMenuOpen()">Exportar Excel</span>
    </button>
  </nav>
</div>

<!-- Mobile Overlay -->
<div
  class="sidebar-overlay"
  *ngIf="isMobileMenuOpen()"
  (click)="closeMobileMenu()">
</div>
