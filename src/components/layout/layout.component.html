<div class="flex min-h-screen bg-gray-50 dark:bg-gray-900 min-w-fit">
  <app-sidebar></app-sidebar>

  <!-- Mobile Menu Button -->
  <button
    class="hidden max-md:flex fixed top-4 left-4 z-[1001] w-11 h-11 rounded-xl cursor-pointer
           border-0 bg-transparent dark:bg-transparent
           text-gray-700 dark:text-white
           active:scale-95 transition-all duration-200 items-center justify-center"
    (click)="openMobileMenu()"
    type="button"
    aria-label="Abrir menú">
    <i class="pi pi-bars text-xl"></i>
  </button>

  <main class="flex-1 ml-[280px] transition-[margin-left] duration-300 min-h-screen overflow-x-auto min-w-0
               max-md:ml-0"
        [class.!ml-20]="sidebarCollapsed"
        [class.max-md:!ml-0]="sidebarCollapsed">
    <router-outlet></router-outlet>
  </main>
</div>
